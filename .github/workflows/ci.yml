name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build WPF application
        run: |
          $ErrorActionPreference = 'Stop'
          .\build.ps1 -OutputDirectory .\work\ci\build

      - name: Run regression tests
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $testDirectory = Join-Path $PWD 'src/tests'
          $tests = @()
          if (Test-Path -LiteralPath $testDirectory -PathType Container) {
            $tests = @(Get-ChildItem -LiteralPath $testDirectory -Filter '*.ps1' -File | Sort-Object Name)
          }

          if ($tests.Count -eq 0) {
            Write-Host '::notice::Build completed; this revision has no regression scripts in src/tests.'
            'Build completed. No regression scripts exist on this revision.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }

          $failed = @()
          foreach ($test in $tests) {
            Write-Host "::group::Regression: $($test.Name)"
            try {
              & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -File $test.FullName
              if ($LASTEXITCODE -ne 0) {
                $failed += $test.Name
              }
            } finally {
              Write-Host '::endgroup::'
            }
          }

          "Regression scripts: $($tests.Count); passed: $($tests.Count - $failed.Count); failed: $($failed.Count)." >> $env:GITHUB_STEP_SUMMARY
          if ($failed.Count -gt 0) {
            throw "Regression scripts failed: $($failed -join ', ')"
          }
